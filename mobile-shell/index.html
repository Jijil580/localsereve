<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1769e0" />
    <title>Nearleo</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #1769e0;
        color: #fff;
        font-family: Arial, sans-serif;
      }

      body {
        display: grid;
        place-items: center;
      }

      .brand {
        display: grid;
        justify-items: center;
        gap: 14px;
      }

      .mark {
        display: grid;
        width: 92px;
        height: 92px;
        place-items: center;
        border: 2px solid rgba(255, 255, 255, 0.55);
        border-radius: 26px;
        background: linear-gradient(145deg, #2781ff, #163ac2);
        box-shadow: 0 20px 50px rgba(0, 25, 105, 0.35);
        font: 700 58px Georgia, serif;
      }

      strong {
        font-size: 28px;
        letter-spacing: -0.02em;
      }
    </style>
  </head>
  <body>
    <main class="brand" aria-label="Loading Nearleo">
      <div class="mark" aria-hidden="true">N</div>
      <strong>Nearleo</strong>
    </main>
  </body>
</html>
