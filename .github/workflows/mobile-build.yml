name: Build Nearleo Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - "ios/**"
      - "mobile-shell/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mobile-build.yml"

permissions:
  contents: read

jobs:
  android-apk:
    name: Android test APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out Nearleo
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install project dependencies
        run: npm ci

      - name: Synchronize Nearleo mobile assets
        run: npm run mobile:sync

      - name: Build installable debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Name APK for download
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Nearleo-Android.apk

      - name: Upload Nearleo APK
        uses: actions/upload-artifact@v4
        with:
          name: Nearleo-Android-APK
          path: Nearleo-Android.apk
          if-no-files-found: error
          retention-days: 30
